<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nachtradio</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%23161a2b'/><circle cx='10.5' cy='5.5' r='3' fill='%23f2c879'/><circle cx='12' cy='4.6' r='2.6' fill='%23161a2b'/></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>
<main>
  <section class="player" aria-label="Nachtradio">
    <p class="eyebrow">Nachtradio · endlose Lo-Fi-Beats, live im Browser erzeugt</p>
    <h1 id="title">Stilles Fenster</h1>
    <p id="meta" class="meta">–</p>
    <div class="transport">
      <button id="play" type="button" class="play" aria-label="Abspielen"><svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path id="playIcon" d="M8 5v14l11-7z" fill="currentColor"/></svg></button>
      <button id="next" type="button" title="Neues Stück (N)">Neues Stück</button>
      <button id="share" type="button" title="Link zu diesem Stück kopieren">Link kopieren</button>
    </div>
    <div class="moods seg" id="moods" role="radiogroup" aria-label="Stimmung"></div>
    <div class="layers" id="layers" role="group" aria-label="Spuren"></div>
    <div class="sliders">
      <label>Lautstärke <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8"></label>
      <label>Wärme <input id="warm" type="range" min="0" max="1" step="0.01" value="0.35"></label>
    </div>
    <div class="row">
      <label class="sel">Schlaftimer
        <select id="sleep"><option value="0">aus</option><option value="15">15 min</option><option value="30">30 min</option><option value="60">60 min</option></select>
      </label>
      <label class="check"><input id="auto" type="checkbox" checked> alle 3 Minuten ein neues Stück</label>
    </div>
    <p id="msg" class="msg" role="status" aria-live="polite"></p>
  </section>
</main>
<script type="module" src="main.mjs"></script>
</body>
</html>
